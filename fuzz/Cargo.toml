# cargo-fuzz-Crate (läuft mit nightly: `cargo +nightly fuzz run <target>`).
# Eigenes Workspace-Root — wie telenot-esp-bridge via `exclude` aus dem Host-Workspace.
[workspace]

[package]
name = "telenot-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
telenot-protocol = { path = "../crates/telenot-protocol" }
telenot-config = { path = "../crates/telenot-config" }
telenot-app = { path = "../crates/telenot-app" }

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_iter"
path = "fuzz_targets/record_iter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_dto"
path = "fuzz_targets/api_dto.rs"
test = false
doc = false
bench = false
