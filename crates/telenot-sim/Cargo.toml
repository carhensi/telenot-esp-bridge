[package]
name = "telenot-sim"
version = "0.0.0"
description = "Host-Runner: fährt den echten telenot-core gegen Replay/TCP/Serial — ohne ESP32."
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
telenot-protocol = { path = "../telenot-protocol" }
telenot-config = { path = "../telenot-config" }
telenot-core = { path = "../telenot-core" }
telenot-app = { path = "../telenot-app" }
tiny_http = "0.12"
serde_json = "1"
# Klartext-MQTT (Plain TCP). TLS bewusst aus → schlanke Deps; auf dem Host genügt der
# LAN-Klartext-Broker (Port 1883). Echtes TLS macht die Firmware via esp-mqtt.
rumqttc = { version = "0.25", default-features = false }

[lints]
workspace = true
