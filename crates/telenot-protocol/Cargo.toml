[package]
name = "telenot-protocol"
version = "0.0.0"
description = "Pure, no_std Telenot GMS (IEC 60870-5-1 FT1.2) framing, checksum and telegram codec."
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
