# Dependabot: wöchentlich, minor/patch gebündelt (weniger PRs = weniger CI-Minuten
# auf dem privaten Repo). Majors kommen einzeln — die will man bewusst reviewen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Host-Workspace (protocol/config/core/app/sim)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Firmware-Crate (eigener xtensa-Workspace) ist bewusst NICHT mehr dabei:
  # Dependabot kann den espup-Toolchain "esp" aus rust-toolchain.toml nicht
  # installieren und schlug deshalb bei jedem Lauf fehl. Bumps dort passieren
  # manuell — ohnehin nur mergen, wenn die Firmware lokal warning-frei baut
  # (CI baut xtensa nicht); cargo-audit im Security-Workflow prüft das Lockfile weiter.

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
