name: Release

# Baut das merged Flash-Image (Bootloader + Partition-Table + App) und veröffentlicht es:
# - bei Tag v*: als GitHub-Release-Assets (.bin + .sha256 + manifest.json)
# - immer: als Pages-Artefakt für den Web-Flasher (flasher/index.html + esp-web-tools)
# Pages-Deploy ist API-gegated: auf privatem Repo (Free-Plan) wird er grün übersprungen;
# nach dem Public-Schalten Pages aktivieren (Source: GitHub Actions) und Workflow re-runnen.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ohne v-Prefix), nur für manuelle Läufe"
        required: false
        default: "0.0.0-dev"

# Least-Privilege-Default; die Jobs erweitern nur, was sie wirklich brauchen.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Firmware + merged Image
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release-Assets anhängen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # esp-homekit-sdk — ohne das scheitert esp-idf-sys kryptisch
          persist-credentials: false

      - name: Version bestimmen
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # CalVer-Konsistenz: Der Tag treibt die Artefakt-Namen, aber die Version IM Image
      # (app_desc → Update-Panel/Update-Check) kommt aus Cargo.toml. Driften die
      # auseinander, zeigt das Gerät nach dem Update die falsche Version → hart abbrechen.
      - name: Tag == Cargo.toml prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CARGO_VER=$(grep -m1 '^version' crates/telenot-esp-bridge/Cargo.toml | cut -d'"' -f2)
          if [[ "${CARGO_VER}" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::Tag v${{ steps.ver.outputs.version }} ≠ Cargo.toml ${CARGO_VER} — erst Version bumpen, dann taggen"
            exit 1
          fi

      # Web-Bundle ZUERST — die Firmware bettet web/dist/index.html per include_bytes! ein.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Setup-Web bauen
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # espup-Toolchain (esp-Channel inkl. rust-src für build-std); ldproxy-Default ist false!
      - uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "crates/telenot-esp-bridge -> target"
          # ESP-IDF v5.5.4 + Tools landen im Crate (ESP_IDF_TOOLS_INSTALL_DIR=workspace)
          cache-directories: crates/telenot-esp-bridge/.embuild

      - name: Firmware bauen (esp-idf-sys lädt/baut ESP-IDF v5.5.4 selbst)
        working-directory: crates/telenot-esp-bridge
        run: cargo build --release

      # Gepinnt auf die lokal bewährte espflash-Version.
      - name: espflash installieren (Prebuilt)
        run: |
          curl -sSfLO https://github.com/esp-rs/espflash/releases/download/v4.4.0/espflash-x86_64-unknown-linux-gnu.zip
          unzip -o espflash-x86_64-unknown-linux-gnu.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/espflash"
          espflash --version

      # --bootloader PFLICHT seit A/B-OTA: nur der esp-idf-sys-Bootloader wertet
      # PENDING_VERIFY aus (Rollback). Der espflash-Default würde Rollback still töten.
      # --skip-padding: sonst wird das Image auf volle 16 MB aufgefüllt.
      - name: Merged Image erzeugen (Erstinstallation via Kabel/Web-Flasher)
        run: |
          espflash save-image \
            --chip esp32 \
            --merge \
            --skip-padding \
            --flash-size 16mb \
            --bootloader crates/telenot-esp-bridge/target/xtensa-esp32-espidf/release/bootloader.bin \
            --partition-table crates/telenot-esp-bridge/partitions.csv \
            crates/telenot-esp-bridge/target/xtensa-esp32-espidf/release/telenot-esp-bridge \
            "telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin"
          sha256sum "telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin" \
            > "telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin.sha256"
          ls -lh telenot-esp-bridge-*.bin

      # App-only-Image (ohne Bootloader/Partition-Table) — DAS lädt man im
      # Firmware-Update-Panel hoch. ota.json ist maschinenlesbares Futter für den
      # geräteseitigen Update-Check (Phase „GitHub-Pull", nach Public-Stellung).
      - name: OTA-App-Image + ota.json erzeugen
        run: |
          VER="${{ steps.ver.outputs.version }}"
          espflash save-image \
            --chip esp32 \
            --flash-size 16mb \
            crates/telenot-esp-bridge/target/xtensa-esp32-espidf/release/telenot-esp-bridge \
            "telenot-esp-bridge-app-${VER}.bin"
          sha256sum "telenot-esp-bridge-app-${VER}.bin" \
            > "telenot-esp-bridge-app-${VER}.bin.sha256"
          SHA=$(cut -d' ' -f1 "telenot-esp-bridge-app-${VER}.bin.sha256")
          SIZE=$(stat -c%s "telenot-esp-bridge-app-${VER}.bin")
          cat > ota.json <<EOF
          {
            "version": "${VER}",
            "sha256": "${SHA}",
            "size": ${SIZE},
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/telenot-esp-bridge-app-${VER}.bin"
          }
          EOF
          ls -lh telenot-esp-bridge-app-*.bin

      # new_install_prompt_erase: Nutzer entscheidet — Voll-Erase löscht Sensor-Config,
      # MQTT-Zugang UND HomeKit-Pairing (factory_nvs).
      - name: manifest.json generieren (esp-web-tools)
        run: |
          cat > manifest.json <<EOF
          {
            "name": "telenot-esp-bridge",
            "version": "${{ steps.ver.outputs.version }}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      # Das .bin muss same-origin neben der Seite liegen (GitHub-Release-Assets senden kein CORS).
      - name: Pages-Bundle zusammenstellen
        run: |
          mkdir -p _site
          cp flasher/index.html _site/
          cp manifest.json _site/
          cp "telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin" _site/
          sed -i "s/__VERSION__/${{ steps.ver.outputs.version }}/g" _site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: GitHub Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin
            telenot-esp-bridge-${{ steps.ver.outputs.version }}.bin.sha256
            telenot-esp-bridge-app-${{ steps.ver.outputs.version }}.bin
            telenot-esp-bridge-app-${{ steps.ver.outputs.version }}.bin.sha256
            ota.json
            manifest.json

  deploy-pages:
    name: Web-Flasher deployen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      # Privates Repo auf Free-Plan: /pages liefert 404 → Deploy grün überspringen.
      - name: Pages-Verfügbarkeit prüfen
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages nicht verfügbar (privates Repo / Free-Plan?). Deploy übersprungen — merged .bin + manifest hängen am Release."
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        if: steps.gate.outputs.enabled == 'true'
